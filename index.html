<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5b21b6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My Voice">
  <link rel="manifest" href="manifest.json">
  <title>My Voice</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --feelings:   #ec4899;
      --food:       #f97316;
      --activities: #3b82f6;
      --needs:      #22c55e;
      --behaviour:  #a855f7;
      --upset:      #ef4444;
      --daily:      #f59e0b;
      --bg:         #111827;
      --surface:    #1f2937;
      --text:       #f9fafb;
      --muted:      #9ca3af;
      --radius:     18px;
    }

    html, body {
      min-height: 100%;
      min-height: 100svh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow-x: hidden;
    }

    /* ── SCREENS ── */
    .screen {
      display: none;
      min-height: 100svh;
      padding: 16px;
    }

    .screen.active {
      display: flex;
      flex-direction: column;
    }

    /* ── HOME ── */
    #home {
      align-items: center;
      padding: 32px 16px 40px;
      gap: 0;
    }

    .home-hero {
      text-align: center;
      margin-bottom: 32px;
    }

    .home-hero .hero-icon {
      font-size: 3.5rem;
      display: block;
      margin-bottom: 10px;
      line-height: 1;
    }

    .home-hero h1 {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .home-hero p {
      color: var(--muted);
      margin-top: 6px;
      font-size: 1.05rem;
    }

    .cat-list {
      display: flex;
      flex-direction: column;
      gap: 13px;
      width: 100%;
      max-width: 460px;
    }

    .cat-btn {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 20px 22px;
      border-radius: var(--radius);
      border: none;
      cursor: pointer;
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      text-align: left;
      transition: opacity 0.12s, transform 0.12s;
      min-height: 70px;
      -webkit-user-select: none;
      user-select: none;
    }

    .cat-btn:active {
      opacity: 0.78;
      transform: scale(0.97);
    }

    .cat-btn .btn-icon  { font-size: 1.9rem; flex-shrink: 0; }
    .cat-btn .btn-text  { flex: 1; }
    .cat-btn .btn-arrow { font-size: 1.3rem; opacity: 0.6; }

    .cat-btn[data-cat="feelings"]   { background: var(--feelings); }
    .cat-btn[data-cat="food"]       { background: var(--food); }
    .cat-btn[data-cat="activities"] { background: var(--activities); }
    .cat-btn[data-cat="needs"]      { background: var(--needs); }
    .cat-btn[data-cat="behaviour"]  { background: var(--behaviour); }
    .cat-btn[data-cat="upset"]       { background: var(--upset); }
    .cat-btn[data-cat="daily"]       { background: var(--daily); }

    .home-footer {
      margin-top: 28px;
    }

    .ghost-btn {
      background: transparent;
      border: 2px solid var(--surface);
      color: var(--muted);
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    /* ── SHARED PAGE HEADER ── */
    .page-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 0 18px;
      flex-shrink: 0;
    }

    .back-btn {
      background: var(--surface);
      border: none;
      color: var(--text);
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
      transition: opacity 0.1s;
    }

    .back-btn:active { opacity: 0.7; }

    .page-title {
      font-size: 1.4rem;
      font-weight: 800;
    }

    /* ── CARD GRID ── */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    @media (min-width: 390px) {
      .card-grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (min-width: 700px) {
      .card-grid { grid-template-columns: repeat(4, 1fr); }
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 16px 8px;
      border-radius: 16px;
      background: var(--surface);
      border: 2.5px solid transparent;
      cursor: pointer;
      transition: transform 0.12s, opacity 0.12s;
      min-height: 92px;
      text-align: center;
      -webkit-user-select: none;
      user-select: none;
    }

    .card:active {
      transform: scale(0.9);
      opacity: 0.75;
    }

    .card .card-emoji {
      font-size: 2.5rem;
      line-height: 1;
    }

    .card .card-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.3;
    }

    /* per-category border accent */
    .grid-feelings   .card:not(.else-card) { border-color: var(--feelings); }
    .grid-food       .card:not(.else-card) { border-color: var(--food); }
    .grid-activities .card:not(.else-card) { border-color: var(--activities); }
    .grid-needs      .card:not(.else-card) { border-color: var(--needs); }
    .grid-behaviour  .card:not(.else-card) { border-color: var(--behaviour); }
    .grid-upset      .card:not(.else-card) { border-color: var(--upset); }
    .grid-daily      .card:not(.else-card) { border-color: var(--daily); }

    .card.else-card {
      border-style: dashed;
      border-color: var(--muted);
      background: transparent;
    }

    .card.else-card .card-label { color: var(--muted); }

    /* ── SELECTED CARD ── */
    .card.selected {
      position: relative;
    }
    .card.selected::after {
      content: '✓';
      position: absolute;
      top: 5px;
      right: 6px;
      width: 20px;
      height: 20px;
      background: #22c55e;
      color: #fff;
      border-radius: 50%;
      font-size: 0.72rem;
      font-weight: 800;
      line-height: 20px;
      text-align: center;
    }
    .grid-feelings   .card.selected { background: color-mix(in srgb, var(--feelings) 22%, var(--surface)); }
    .grid-food       .card.selected { background: color-mix(in srgb, var(--food) 22%, var(--surface)); }
    .grid-activities .card.selected { background: color-mix(in srgb, var(--activities) 22%, var(--surface)); }
    .grid-needs      .card.selected { background: color-mix(in srgb, var(--needs) 22%, var(--surface)); }
    .grid-behaviour  .card.selected { background: color-mix(in srgb, var(--behaviour) 22%, var(--surface)); }
    .grid-upset      .card.selected { background: color-mix(in srgb, var(--upset) 22%, var(--surface)); }
    .grid-daily      .card.selected { background: color-mix(in srgb, var(--daily) 22%, var(--surface)); }

    /* ── SEND BAR ── */
    .send-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 16px 36px;
      background: linear-gradient(transparent, var(--bg) 40%);
      display: none;
      z-index: 50;
    }
    .send-bar.visible { display: block; }
    /* extra bottom space so last card isn't hidden behind send bar */
    #category.has-send { padding-bottom: 110px; }

    /* ── CONFIRM ITEMS ── */
    .conf-items-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 320px;
    }
    .conf-item {
      background: var(--surface);
      border-radius: 12px;
      padding: 13px 18px;
      font-size: 1.2rem;
      font-weight: 700;
      text-align: center;
    }
    .confirm-redirect-hint {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 4px;
    }

    /* ── WIZARD ── */
    #wizard { gap: 0; padding: 16px 16px 120px; }

    .wizard-progress {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
      flex-shrink: 0;
    }
    .wiz-dot {
      flex: 1;
      height: 5px;
      border-radius: 3px;
      background: var(--surface);
      transition: background 0.2s;
    }
    .wiz-dot.done  { background: #f59e0b; }
    .wiz-dot.active{ background: #fde68a; }

    .wizard-step-label {
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
      margin-bottom: 6px;
      flex-shrink: 0;
    }

    .wizard-question {
      font-size: 1.5rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 18px;
      line-height: 1.25;
      flex-shrink: 0;
    }

    .wizard-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    @media (min-width: 390px) { .wizard-grid { grid-template-columns: repeat(3, 1fr); } }

    .wiz-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 10px 16px 34px;
      background: linear-gradient(transparent, var(--bg) 40%);
      z-index: 50;
      display: flex;
      gap: 10px;
    }
    .wiz-skip {
      flex: 0 0 auto;
      padding: 16px 20px;
      border-radius: 14px;
      border: 2px solid var(--surface);
      background: transparent;
      color: var(--muted);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    .wiz-next {
      flex: 1;
      padding: 18px;
      border-radius: 14px;
      border: none;
      background: #f59e0b;
      color: #fff;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.1s;
    }
    .wiz-next:active { opacity: 0.8; }

    /* ── DAY SUMMARY ── */
    #daysummary {
      gap: 14px;
      padding: 20px 16px 140px;
      align-items: stretch;
    }
    .dsummary-title {
      font-size: 1.4rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 4px;
    }
    .dsummary-section {
      background: var(--surface);
      border-radius: 14px;
      overflow: hidden;
    }
    .dsummary-heading {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #f59e0b;
      padding: 10px 14px 4px;
    }
    .dsummary-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 6px 14px 12px;
    }
    .dsummary-chip {
      background: color-mix(in srgb, #f59e0b 18%, var(--surface));
      border: 1.5px solid #f59e0b;
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .dsummary-skip {
      font-size: 0.82rem;
      color: var(--muted);
      padding: 6px 14px 10px;
    }
    .dsummary-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      padding: 10px 16px 34px;
      background: linear-gradient(transparent, var(--bg) 40%);
      z-index: 50;
      display: flex;
      gap: 10px;
    }

    /* ── TEXT INPUT ── */
    #textinput { gap: 14px; }

    .free-label {
      font-size: 1.05rem;
      color: var(--muted);
    }

    textarea.free-input {
      flex: 1;
      width: 100%;
      background: var(--surface);
      border: 2.5px solid var(--muted);
      border-radius: 14px;
      color: var(--text);
      font-size: 1.1rem;
      font-family: inherit;
      padding: 16px;
      min-height: 140px;
      resize: none;
      outline: none;
    }

    textarea.free-input:focus { border-color: var(--text); }

    .primary-btn {
      width: 100%;
      padding: 18px;
      border-radius: 14px;
      border: none;
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      transition: opacity 0.1s;
      flex-shrink: 0;
    }

    .primary-btn:active { opacity: 0.8; }

    /* ── CONFIRM ── */
    #confirm {
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 20px;
      padding: 40px 24px;
    }

    .confirm-tick {
      width: 82px;
      height: 82px;
      background: #22c55e;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      color: #fff;
    }

    .confirm-got {
      font-size: 1.3rem;
      font-weight: 700;
      color: #22c55e;
    }

    .confirm-emoji-big { font-size: 5rem; line-height: 1; }

    .confirm-chosen {
      font-size: 2rem;
      font-weight: 800;
      max-width: 320px;
      line-height: 1.2;
    }

    .confirm-cat-label {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .confirm-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 340px;
      margin-top: 8px;
    }

    .confirm-home-btn { background: #5b21b6; }

    .secondary-btn {
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      border: 2px solid var(--surface);
      background: transparent;
      color: var(--muted);
      font-size: 1rem;
      cursor: pointer;
      transition: opacity 0.1s;
    }

    .secondary-btn:active { opacity: 0.7; }

    /* ── HISTORY ── */
    .history-toolbar {
      justify-content: space-between;
    }

    .history-toolbar .page-title { flex: 1; }

    .danger-ghost {
      background: transparent;
      border: 2px solid #ef4444;
      color: #ef4444;
      padding: 9px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      overflow-y: auto;
    }

    .h-item {
      background: var(--surface);
      border-radius: 12px;
      padding: 13px 15px;
    }

    .h-answer {
      font-size: 1rem;
      font-weight: 700;
    }

    .h-meta {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 3px;
    }

    .h-empty {
      text-align: center;
      color: var(--muted);
      margin: 60px auto;
      font-size: 1rem;
      line-height: 1.7;
    }

    .export-btn {
      margin-top: 14px;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 2px solid var(--surface);
      background: transparent;
      color: var(--text);
      font-size: 0.95rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .export-btn:active { opacity: 0.7; }
  </style>
</head>
<body>

<!-- ════════ HOME ════════ -->
<div id="home" class="screen active">
  <div class="home-hero">
    <span class="hero-icon">💬</span>
    <h1>My Voice</h1>
    <p>What do you want to say?</p>
  </div>
  <div class="cat-list">
    <button class="cat-btn" data-cat="feelings" onclick="openCategory('feelings')">
      <span class="btn-icon">💭</span>
      <span class="btn-text">How I'm feeling</span>
      <span class="btn-arrow">›</span>
    </button>
    <button class="cat-btn" data-cat="food" onclick="openCategory('food')">
      <span class="btn-icon">🍽️</span>
      <span class="btn-text">Food &amp; Drinks</span>
      <span class="btn-arrow">›</span>
    </button>
    <button class="cat-btn" data-cat="activities" onclick="openCategory('activities')">
      <span class="btn-icon">🎮</span>
      <span class="btn-text">What I want to do</span>
      <span class="btn-arrow">›</span>
    </button>
    <button class="cat-btn" data-cat="needs" onclick="openCategory('needs')">
      <span class="btn-icon">🙋</span>
      <span class="btn-text">What I need</span>
      <span class="btn-arrow">›</span>
    </button>
    <button class="cat-btn" data-cat="upset" onclick="openCategory('upset')">
      <span class="btn-icon">😤</span>
      <span class="btn-text">Why am I upset?</span>
      <span class="btn-arrow">›</span>
    </button>
    <button class="cat-btn" data-cat="behaviour" onclick="openCategory('behaviour')">
      <span class="btn-icon">🗣️</span>
      <span class="btn-text">How I am right now</span>
      <span class="btn-arrow">›</span>
    </button>
    <button class="cat-btn" data-cat="daily" onclick="openCategory('daily')">
      <span class="btn-icon">📅</span>
      <span class="btn-text">Talking about my day</span>
      <span class="btn-arrow">›</span>
    </button>
  </div>
  <div class="home-footer">
    <button class="ghost-btn" onclick="showHistory()">📋 View history</button>
  </div>
</div>

<!-- ════════ CATEGORY ════════ -->
<div id="category" class="screen">
  <div class="page-header">
    <button class="back-btn" onclick="showHome()">← Back</button>
    <div class="page-title" id="cat-title"></div>
  </div>
  <div class="card-grid" id="card-grid"></div>
  <div class="send-bar" id="send-bar">
    <button class="primary-btn" id="send-btn" onclick="sendSelected()">Send</button>
  </div>
</div>

<!-- ════════ WIZARD (Talking about my day) ════════ -->
<div id="wizard" class="screen">
  <div class="page-header">
    <button class="back-btn" onclick="wizBack()">← Back</button>
    <div class="page-title">Talking about my day</div>
  </div>
  <div class="wizard-progress" id="wiz-progress"></div>
  <div class="wizard-step-label" id="wiz-step-label"></div>
  <div class="wizard-question" id="wiz-question"></div>
  <div class="wizard-grid" id="wiz-grid"></div>
  <div class="wiz-bar">
    <button class="wiz-skip" onclick="wizSkip()">Skip</button>
    <button class="wiz-next" onclick="wizNext()">Next →</button>
  </div>
</div>

<!-- ════════ DAY SUMMARY ════════ -->
<div id="daysummary" class="screen">
  <div class="page-header">
    <button class="back-btn" onclick="showHome()">← Home</button>
    <div class="page-title">My Day</div>
  </div>
  <div class="dsummary-title">Here's your day 🌟</div>
  <div id="dsummary-body"></div>
  <div class="dsummary-bar">
    <button class="primary-btn share-btn" id="dsummary-share" style="background:#0ea5e9;flex:0 0 auto;padding:18px 22px;display:none" onclick="shareDaySummary()">&#x2B06; Share</button>
    <button class="primary-btn" style="background:#f59e0b;flex:1" onclick="showHome()">Done ✓</button>
  </div>
</div>

<!-- ════════ TEXT INPUT ════════ -->
<div id="textinput" class="screen">
  <div class="page-header">
    <button class="back-btn" id="ti-back">← Back</button>
    <div class="page-title">Something else</div>
  </div>
  <div class="free-label">Type what you want to say:</div>
  <textarea class="free-input" id="free-input" placeholder="Write it here..."></textarea>
  <button class="primary-btn" id="ti-submit" onclick="submitFreeText()">Done ✓</button>
</div>

<!-- ════════ CONFIRM ════════ -->
<div id="confirm" class="screen">
  <div class="confirm-tick">✓</div>
  <div class="confirm-got">Got it!</div>
  <div class="conf-items-list" id="conf-items"></div>
  <div class="confirm-cat-label" id="conf-cat"></div>
  <div class="confirm-redirect-hint">Going home in a moment...</div>
  <div class="confirm-actions">
    <button class="primary-btn confirm-home-btn" onclick="showHome()">Back to home</button>
    <button class="primary-btn share-btn" id="conf-share" style="background:#0ea5e9;display:none" onclick="shareSelection()">&#x2B06; Share this</button>
    <button class="secondary-btn" id="conf-again">Tell me something else</button>
  </div>
</div>

<!-- ════════ HISTORY ════════ -->
<div id="history" class="screen">
  <div class="page-header history-toolbar">
    <button class="back-btn" onclick="showHome()">← Back</button>
    <div class="page-title">History</div>
    <button class="danger-ghost" onclick="clearHistory()">Clear all</button>
  </div>
  <div class="history-list" id="history-list"></div>
  <button class="export-btn" onclick="exportHistory()">⬇ Export as text (for reports)</button>
</div>

  // ── DAILY WIZARD ─────────────────────────────────────────────────────────
  function openWizard() {
    activeCat  = 'daily';

    wizSel     = [];

    showScreen('wizard');

  function renderWizStep() {
    const step  = DAILY_STEPS[wizStep];
    const total = DAILY_STEPS.length;

    // progress dots
    document.getElementById('wiz-progress').innerHTML =
      DAILY_STEPS.map((_, i) =>
        `<div class="wiz-dot ${i < wizStep ? 'done' : i === wizStep ? 'active' : ''}"></div>`
      ).join('');

    document.getElementById('wiz-step-label').textContent = `Step ${wizStep + 1} of ${total}`;
    document.getElementById('wiz-question').textContent   = step.question;

    const grid = document.getElementById('wiz-grid');
    grid.innerHTML = '';
    wizSel = wizAnswers[step.id] || [];

    step.items.forEach(([emoji, label]) => {
      const btn = document.createElement('button');
      const isSelected = wizSel.some(c => c.emoji === emoji && c.label === label);
      btn.className = 'card' + (isSelected ? ' selected' : '');
      btn.style.borderColor = '#f59e0b';
      if (isSelected) btn.style.background = 'color-mix(in srgb, #f59e0b 22%, var(--surface))';
      btn.innerHTML = `<span class="card-emoji">${emoji}</span><span class="card-label">${label}</span>`;
      btn.onclick = () => wizToggle(emoji, label, btn);
      grid.appendChild(btn);
    });
  }

  function wizToggle(emoji, label, btn) {
    const idx = wizSel.findIndex(c => c.emoji === emoji && c.label === label);
    if (idx >= 0) {
      wizSel.splice(idx, 1);
      btn.classList.remove('selected');
      btn.style.background = '';
    } else {
      wizSel.push({ emoji, label });
      btn.classList.add('selected');
      btn.style.background = 'color-mix(in srgb, #f59e0b 22%, var(--surface))';
    }
  }

  function wizNext() {
    const step = DAILY_STEPS[wizStep];
    wizAnswers[step.id] = wizSel.slice();
    if (wizStep < DAILY_STEPS.length - 1) {
      wizStep++;
      wizSel = wizAnswers[DAILY_STEPS[wizStep].id] || [];
      renderWizStep();
      window.scrollTo(0, 0);
    } else {
      finishWizard();
    }
  }

  function wizSkip() {
    wizAnswers[DAILY_STEPS[wizStep].id] = [];
    if (wizStep < DAILY_STEPS.length - 1) {
      wizStep++;
      wizSel = [];
      renderWizStep();
      window.scrollTo(0, 0);
    } else {
      finishWizard();
    }
  }

  function wizBack() {
    if (wizStep > 0) {
      wizAnswers[DAILY_STEPS[wizStep].id] = wizSel.slice();
      wizStep--;
      wizSel = wizAnswers[DAILY_STEPS[wizStep].id] || [];
      renderWizStep();
      window.scrollTo(0, 0);
    } else {
      showHome();
    }
  }

  function finishWizard() {
    // Save all answered items to history and notify
    const ts = Date.now();
    Object.entries(wizAnswers).forEach(([stepId, items]) => {
      const stepDef = DAILY_STEPS.find(s => s.id === stepId);
      items.forEach(({ emoji, label }) => {
        const history = loadHistory();
        history.unshift({ ts, category: 'Talking about my day', emoji, label });
        localStorage.setItem('mv_history', JSON.stringify(history.slice(0, 500)));
      });
    });

    // Send one combined Telegram notification
    const lines = DAILY_STEPS
      .map(s => {
        const picks = wizAnswers[s.id] || [];
        if (!picks.length) return null;
        return `${s.question}\n` + picks.map(c => `  ${c.emoji} ${c.label}`).join('\n');
      })
      .filter(Boolean)
      .join('\n\n');
    if (lines) notifyRaw('Talking about my day', lines);

    buildDaySummary();
    showScreen('daysummary');
  }

  function buildDaySummary() {
    const body = document.getElementById('dsummary-body');
    body.innerHTML = DAILY_STEPS.map(step => {

      return `<div class="dsummary-section">
        <div class="dsummary-heading">${step.question}</div>
        ${ picks.length
          ? `<div class="dsummary-row">${picks.map(c =>
              `<span class="dsummary-chip">${c.emoji} ${c.label}</span>`).join('')}</div>`
          : `<div class="dsummary-skip">skipped</div>`
        }
      </div>`;
    }).join('');

    const shareBtn = document.getElementById('dsummary-share');
    shareBtn.style.display = navigator.share ? 'inline-flex' : 'none';

  // ── HISTORY ───────────────────────────────────────────────────────────────
  function loadHistory() {
    try { return JSON.parse(localStorage.getItem('mv_history') || '[]'); }
    catch { return []; }
  }

  function saveEntry(emoji, label) {
    const cat = CATS[activeCat];
    const history = loadHistory();
    history.unshift({
      ts:       Date.now(),
      category: cat ? cat.label : '',
      emoji,
      label,
    });
    // Keep up to 500 entries
    localStorage.setItem('mv_history', JSON.stringify(history.slice(0, 500)));
  }

  function showHistory() {
    const history = loadHistory();
    const list = document.getElementById('history-list');

    if (!history.length) {
      list.innerHTML = '<div class="h-empty">No history yet.<br>Start by tapping a category on the home screen.</div>';
    } else {
      list.innerHTML = history.map(e => {
        const d  = new Date(e.ts);
        const ds = d.toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' });
        const ts = d.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' });
        return `<div class="h-item">
          <div class="h-answer">${e.emoji} ${e.label}</div>
          <div class="h-meta">${e.category} &bull; ${ds} at ${ts}</div>
        </div>`;
      }).join('');
    }

    showScreen('history');
  }

  function clearHistory() {
    if (!confirm('Clear all history? This cannot be undone.')) return;
    localStorage.removeItem('mv_history');
    showHistory();
  }

  function exportHistory() {
    const history = loadHistory();
    if (!history.length) { alert('No history to export.'); return; }

    const lines = history.map(e => {
      const d = new Date(e.ts);
      const date = d.toLocaleDateString('en-AU', { day: '2-digit', month: '2-digit', year: 'numeric' });
      const time = d.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit' });
      return `${date} ${time} | ${e.category} | ${e.label}`;
    }).join('\n');

    const blob = new Blob([lines], { type: 'text/plain' });
    const a = Object.assign(document.createElement('a'), {
      href:     URL.createObjectURL(blob),
      download: `my-voice-history-${new Date().toLocaleDateString('en-CA')}.txt`,
    });
    a.click();
    URL.revokeObjectURL(a.href);
  }
</script>
